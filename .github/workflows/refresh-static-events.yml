name: Refresh Static Event Listings

# Refreshes the pre-rendered event tiles, JSON-LD, sitemap.xml and llms.txt
# from Sanity, and lands them through `staging` like any other change (#431).
#
# It used to push to one long-lived automation branch that nothing merged: that
# branch ended up 209 commits ahead and 158 behind main while every marker pair
# in production stayed empty. Now each run cuts a fresh branch from `staging`
# and writes a link to open the PR into it.
#
# It does not open the PR itself, for the same reasons as rollback-main.yml
# (#464): a PR opened with GITHUB_TOKEN triggers none of staging's required
# checks, so it could never merge, and creating one needs "Allow GitHub Actions
# to create and approve pull requests", which stays off. For the same reason
# the branch is per-run: a later push by GITHUB_TOKEN to an open PR would not
# re-run its checks. A PR opened by a person runs the full gate.
#
# Runs on a daily schedule and can also be triggered manually. Fails (and
# pushes nothing) if Sanity returns fewer than the minimum number of events;
# see assertMinimumCount in scripts/prebuild-events.js.
#
# No `npm ci`: these scripts require only https, fs and path
# (tests/unit/refresh-static-events-workflow.spec.js keeps that true).
#
# Old per-run branches are safe to delete once their PR is merged or closed.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: refresh-static-events
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    name: Pre-render static event listings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run prebuild on a fresh branch and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/refresh-static-events-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git switch -c "${BRANCH}"
          node scripts/prebuild-events.js
          node scripts/generate-llms-txt.js
          git add pop-ups.html date-ideas.html sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "No changes detected: the listings, sitemap and llms.txt are already up to date." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git commit -m "chore: refresh static event listings"
          git push origin "${BRANCH}"
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/staging...${BRANCH}?expand=1"
          {
            echo "## Refreshed listings are ready on \`${BRANCH}\`"
            echo
            echo "**[Open the pull request into staging](${COMPARE_URL})**"
          } >> "${GITHUB_STEP_SUMMARY}"
